[package]
name = "spike-dcomp"
version = "0.1.0"
edition = "2021"
publish = false
description = "P0 互操作 spike：DX12 wgpu + DirectComposition 组合交换链 + 后缓冲导入"

[dependencies]
wgpu = "27"
pollster = "0.4"

# windows crate 版本必须与 wgpu-hal 的 windows 依赖同源（wgpu-hal 27.0.4 用 windows 0.58），
# 否则 COM 接口类型（ID3D12Device/Queue/Resource）跨版本不互认，互操作链无法编译。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Foundation_Numerics",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Storage_Xps",
] }
