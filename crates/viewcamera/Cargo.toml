[package]
name = "viewcamera"
version = "0.1.0"
edition = "2021"
description = "Camera light control and the wgpu camera render pipeline"
authors = ["SECTL"]

[dependencies]
# 与 viewstage / viewink 主包保持一致的版本，避免 iced/wgpu 类型被重复编译导致边界类型不匹配
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
iced = { version = "0.14", default-features = false, features = ["wgpu", "canvas", "image-without-codecs", "advanced", "tokio", "svg", "crisp", "web-colors"] }
iced_wgpu = "0.14"
log = "0.4"
# 设备采集与像素格式处理已迁到 zephyra-camera（feature = "capture"）——
# 见 crates/zephyra-camera/src/lib.rs 里"哪些没有搬过来"一节。
#
# 但本 crate 仍然需要 bytes：`FramePixels::Nv12` 直接持有 `bytes::Bytes`，
# 而 NV12 平面的**生产端**已经在 zephyra-camera 那侧。所以两侧必须解析到同一个
# bytes 版本，否则 `Arc<Bytes>` 跨边界时类型不匹配——那正是"重复依赖版本"
# 最容易咬人的地方。
bytes = "1"

# 笔迹引擎（共享 GPU 原语 / 实时状态 / 渲染统计）
viewink = { path = "../viewink" }

[target.'cfg(windows)'.dependencies]
# 希沃补光灯（USB HID）；与 viewstage 主包一致，仅在 Windows 提供
hidapi = "2"
