[package]
name = "viewcamera"
version = "0.1.0"
edition = "2021"
description = "Camera processing & connection engine: device capture, frame processing, light control, and the wgpu camera render pipeline"
authors = ["SECTL"]

[dependencies]
# 与 viewstage / viewink 主包保持一致的版本，避免 iced/wgpu 类型被重复编译导致边界类型不匹配
wgpu = "27"
bytemuck = { version = "1", features = ["derive"] }
iced = { version = "0.14", default-features = false, features = ["wgpu", "canvas", "image-without-codecs", "advanced", "tokio", "svg", "crisp", "web-colors"] }
iced_wgpu = "0.14"
log = "0.4"
# 与 viewstage 主包一致的输入后端
nokhwa = { version = "0.10", features = ["input-msmf"] }
bytes = "1"
# 笔迹引擎（共享 GPU 原语 / 实时状态 / 渲染统计）
viewink = { path = "../viewink" }

[target.'cfg(windows)'.dependencies]
# 希沃补光灯（USB HID）；与 viewstage 主包一致，仅在 Windows 提供
hidapi = "2"
