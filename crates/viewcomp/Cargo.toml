[package]
name = "viewcomp"
version = "0.1.0"
edition = "2021"
publish = false
description = "DirectComposition 合成基础设施：设备/target/visual/composition swapchain 封装（P1）"

[dependencies]
log = "0.4"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = [
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }
